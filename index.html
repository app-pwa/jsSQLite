<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>SQL.js + Highcharts Example</title>
        <style type="text/css">
            .highcharts-figure,
            .highcharts-data-table table {
                min-width: 310px;
                max-width: 800px;
                margin: 1em auto;
            }
            #container,
            #container2,
            #container3,
            #container4,
            #container5,
            #container6,
            #container7 {
                height: 400px;
            }
            .highcharts-data-table table {
                font-family: Verdana, sans-serif;
                border-collapse: collapse;
                border: 1px solid #ebebeb;
                margin: 10px auto;
                text-align: center;
                width: 100%;
                max-width: 500px;
            }
            .highcharts-data-table caption {
                padding: 1em 0;
                font-size: 1.2em;
                color: #555;
            }
            .highcharts-data-table th {
                font-weight: 600;
                padding: 0.5em;
            }
            .highcharts-data-table td,
            .highcharts-data-table th,
            .highcharts-data-table caption {
                padding: 0.5em;
            }
            .highcharts-data-table thead tr,
            .highcharts-data-table tr:nth-child(even) {
                background: #f8f8f8;
            }
            .highcharts-data-table tr:hover {
                background: #f1f7ff;
            }
        </style>
    </head>
    <body>
        <figure class="highcharts-figure">
            <label for="fileToUpload">เลือกไฟล์ SQLite:</label>
            <input type="file" id="fileToUpload">
            <div id="container"></div>
            <div id="container2"></div>
            <div id="container3"></div>
            <div id="container4"></div>
            <div id="container5"></div>
            <div id="container6"></div>
            <div id="container7"></div>
        </figure>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.6.2/sql-wasm.js"></script>
        <script src="https://code.highcharts.com/highcharts.js"></script>
        <script src="https://code.highcharts.com/modules/exporting.js"></script>
        <script src="https://code.highcharts.com/modules/export-data.js"></script>
        <script src="https://code.highcharts.com/modules/accessibility.js"></script>

        <script>
            document.getElementById('fileToUpload').addEventListener('change', async (event) => {
                const file = event.target.files[0];
      if (!file) return;

      // อ่านไฟล์เป็น ArrayBuffer
      const arrayBuffer = await file.arrayBuffer();
      const uint8Array = new Uint8Array(arrayBuffer);

      // ✅ โหลด SQL.js
      const SQL = await initSqlJs({
        locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.6.2/${file}`
      });

      // สร้างฐานข้อมูลจากไฟล์
      const db = new SQL.Database(uint8Array);
                try {
                    // คิวรีข้อมูลปีสูงสุด
                    const maxYearQuery = `
                SELECT max(strftime('%Y', datetime(date / 1000, 'unixepoch'))) AS max_date
                FROM income_or_expense 
                WHERE category = 'สละ'
              `;
                    const maxYearResult = db.exec(maxYearQuery);
                    const maxYear = maxYearResult.length > 0 ? maxYearResult[0].values[0][0] : new Date().getFullYear();

                    const year = maxYear || new Date().getFullYear();

                    // คิวรีข้อมูลรายเดือน
                    const monthlyQuery = `
                SELECT strftime('%Y-%m', datetime(date / 1000, 'unixepoch')) AS date_col, sum(value) as total,
                GROUP_CONCAT(from_or_to, ';') as kilo, GROUP_CONCAT(notes, ';') as bath
                FROM income_or_expense 
                WHERE category = 'สละ' AND 
                CAST(strftime('%Y', 'now') as int) - CAST(strftime('%Y', datetime(date / 1000, 'unixepoch')) as int) <= 2
                GROUP BY 1
              `;
                    const monthlyResult = db.exec(monthlyQuery);

                    // ประมวลผลข้อมูล
                    const temp = {};
                    for (const row of monthlyResult[0].values) {
                        const [dateCol, total, kilo, bath] = row;
                        temp[dateCol] = [kilo, bath];
                    }

                    const cate = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
                    const cate3 = [];

                    const dataYear = [];
                    const dataYear2 = [];
                    const dataYear3 = [];

                    const kiyearNi = [0, 0, 0];
                    const kiyearBan = [0, 0, 0];

                    for (let y = 0; y < 3; y++) {
                        const monthData = new Array(12).fill(0);
                        const monthData2Ni = new Array(12).fill(0);
                        const monthData2Ban = new Array(12).fill(0);

                        for (let m = 0; m < 12; m++) {
                            const dateKey = `${year - y}-${String(m + 1).padStart(2, '0')}`;
                            if (temp[dateKey]) {
                                const [kilo, bath] = temp[dateKey];
                                let kiloBan = 0;
                                let kiloNi = 0;

                                if (kilo.includes(';')) {
                                    const kiloParts = kilo.split(';');
                                    for (const part of kiloParts) {
                                        const [ban, ni] = part.split('/').map(Number);
                                        kiloBan += isNaN(ban) ? 0 : ban;
                                        kiloNi += isNaN(ni) ? 0 : ni;
                                    }
                                } else if (kilo.includes('/')) {
                                    const [ban, ni] = kilo.split('/').map(Number);
                                    kiloBan += isNaN(ban) ? 0 : ban;
                                    kiloNi += isNaN(ni) ? 0 : ni;
                                } else {
                                    kiloNi += isNaN(kilo) ? 0 : Number(kilo);
                                }

                                monthData[m] = (kiloBan + kiloNi) / 1000;
                                if (y === 0) {
                                    monthData2Ni[m] = kiloNi / 1000;
                                    monthData2Ban[m] = kiloBan / 1000;
                                }


                                kiyearNi[y] += kiloNi;
                                kiyearBan[y] += kiloBan;
                            }

                        }
                        cate3.push(`ปี${((year - 2) + y)}`);
                        dataYear.push({name: `ปี ${year - y}`, data: monthData});
                        if (y === 0) {
                            dataYear2.push({name: 'สวนที่บ้าน', data: monthData2Ban});
                            dataYear2.push({name: 'สวนใน', data: monthData2Ni});
                        }
                    }

                    dataYear3.push({name: 'สวนที่บ้าน', data: [kiyearBan[2] / 1000, kiyearBan[1] / 1000, kiyearBan[0] / 1000]});
                    dataYear3.push({name: 'สวนใน', data: [kiyearNi[2] / 1000, kiyearNi[1] / 1000, kiyearNi[0] / 1000]});

// เพิ่มการประมวลผลข้อมูลสำหรับ container4 ถึง container7
                    const cate4 = [];
                    const cate5 = [];
                    const bathKo = [];
                    const bathKasa = [];
                    const bathKo5 = [];
                    const bathKasa5 = [];

                    const yearlyQuery = `
  SELECT strftime('%Y-%d-%m', datetime(date / 1000, 'unixepoch')) AS date_col, value as total,
  from_or_to as kilo, notes as bath
  FROM income_or_expense 
  WHERE category = 'สละ' AND 
  CAST(strftime('%Y', 'now') as int) - CAST(strftime('%Y', datetime(date / 1000, 'unixepoch')) as int) <= 1
  ORDER BY date
`;
                    const yearlyResult = db.exec(yearlyQuery);

                    for (const row of yearlyResult[0].values) {
                        const [dateCol, total, kilo, bath] = row;
                        if (bath && bath.includes('/')) {
                            const [ko, kasa] = bath.split('/').map(Number);
                            if (dateCol.startsWith(year)) {
                                cate4.push(dateCol.substring(5));
                                bathKo.push(ko);
                                bathKasa.push(kasa);
                            } else {
                                cate5.push(dateCol.substring(5));
                                bathKo5.push(ko);
                                bathKasa5.push(kasa);
                            }
                        }
                    }

                    const dataYear4 = [
                        {name: 'ช่อสวย', data: bathKo},
                        {name: 'กระซ้า', data: bathKasa}
                    ];

                    const dataYear5 = [
                        {name: 'ช่อสวย', data: bathKo5},
                        {name: 'กระซ้า', data: bathKasa5}
                    ];

// คิวรีข้อมูลสำหรับ container6 
                    const avgQuery = `
  SELECT strftime('%Y', datetime(date / 1000, 'unixepoch')) AS date_col, sum(value) as total,
  GROUP_CONCAT(REPLACE(from_or_to, '/', ';'), ';') as kilo, GROUP_CONCAT(notes, ';') as bath
  FROM income_or_expense 
  WHERE category = 'สละ' AND 
  CAST(strftime('%Y', 'now') as int) - CAST(strftime('%Y', datetime(date / 1000, 'unixepoch')) as int) <= 4
  GROUP BY 1
  ORDER BY date
`;
                    const avgResult = db.exec(avgQuery);

                    const bathAvg = [];
                    const cate7 = [];
                    const avgCho = [];
                    const avgSa = [];

                    for (const row of avgResult[0].values) {
                        const [dateCol, total, kilo, bath] = row;
                        let totalKilo = 0;
                        if (kilo.includes(';')) {
                            const kiloParts = kilo.split(';');
                            for (const part of kiloParts) {
                                totalKilo += isNaN(part) ? 0 : Number(part);
                            }
                        } else {
                            totalKilo += isNaN(kilo) ? 0 : Number(kilo);
                        }

                        let choSum = 0;
                        let saSum = 0;
                        let count = 0;
                        if (bath.includes(';')) {
                            const bathParts = bath.split(';');
                            for (const part of bathParts) {
                                if (part.includes('/')) {
                                    const [cho, sa] = part.split('/').map(Number);
                                    choSum += cho;
                                    saSum += sa;
                                    count++;
                                }
                            }
                        }

                        const avgChoVal = count > 0 ? choSum / count : 0;
                        const avgSaVal = count > 0 ? saSum / count : 0;
                        
//                        if (dateCol >= 2023) {
//                            cate7.push(`ปี ${dateCol}`);
//                                               avgCho.push(avgChoVal);
//                                               avgSa.push(avgSaVal);
//                       }

                        
                        if (dateCol  ==  '2021') {
                                 bathAvg.push(  [
                                    `${(total / 100000).toFixed(2)} แสน (${dateCol})`, 36
                                 ]);
                        }else{
                             bathAvg.push(  [
                                `${(total / 100000).toFixed(2)} แสน (${dateCol})`,  totalKilo > 0 ? parseInt( (total / totalKilo).toFixed(2)) : 0
                             ]);
                        }
                       
                    }

                    const dataYear6 = bathAvg;
                    
                    // คิวรีข้อมูลสำหรับ container6 และ container7
                    const avgQuery7 = `
  SELECT strftime('%Y', datetime(date / 1000, 'unixepoch')) AS date_col, sum(value) as total,
  GROUP_CONCAT(REPLACE(from_or_to, '/', ';'), ';') as kilo, GROUP_CONCAT(notes, ';') as bath
  FROM income_or_expense 
  WHERE category = 'สละ' AND 
  CAST(strftime('%Y', 'now') as int) - CAST(strftime('%Y', datetime(date / 1000, 'unixepoch')) as int) <= 2
  GROUP BY 1
  ORDER BY date
`;
                    const avgResult7 = db.exec(avgQuery7);
                    
                    const bathAvg7 = []; // ปี
                    const avgA = [];    // เกรด A
                    const avgB = [];    // เกรด B

                    for (const row of avgResult7[0].values) {
                        const [dateCol, total, kilo, bath] = row;

                        let choSum = 0;
                        let saSum = 0;
                        let count = 0;
                        if (bath.includes(';')) {
                            const bathParts = bath.split(';');
                            for (const part of bathParts) {
                                if (part.includes('/')) {
                                    const [cho, sa] = part.split('/').map(Number);
                                    choSum += cho;
                                    saSum += sa;
                                    count++;
                                }
                            }
                        }
                        
                        const avgChoVal = count > 0 ? choSum / count : 0;
                        const avgSaVal = count > 0 ? saSum / count : 0;
                        
                        if (dateCol >= 2023) {
                            cate7.push(`ปี ${dateCol}`);
                            avgA.push(avgChoVal);
                            avgB.push(avgSaVal);
                       }


                    }
                    const dataYear7 = [
                        {name: 'ช่อสวย', data: avgA},
                        {name: 'กระซ้า', data: avgB}
                    ];
                    console.info(dataYear7);
//                    console.info(dataYear6);
//                      console.info(dataYear3);
                    // สร้างกราฟด้วย Highcharts
                    createCharts(dataYear, dataYear2, dataYear3, cate, cate3,dataYear4, dataYear5, dataYear6, dataYear7, cate4, cate5, cate7);
                } catch (error) {
                    console.error(error);
                }
            });

            function createCharts(dataYear, dataYear2, dataYear3, cate, cate3,dataYear4, dataYear5, dataYear6, dataYear7, cate4, cate5, cate7) {
                Highcharts.chart('container', {
                    chart: {type: 'column'},
                    title: {text: 'ยอดขายสละทั้ง 2สวนย้อนหลัง 3ปี'},
                    xAxis: {categories: cate},
                    yAxis: {title: {text: 'จำนวนตัน'}},
                    series: dataYear
                });

                Highcharts.chart('container2', {
                    chart: {type: 'column'},
                    title: {text: 'จำนวนสละที่ตัดได้ในปีล่าสุดเปรียบเทียบ 2สวน'},
                    xAxis: {categories: cate},
                    yAxis: {title: {text: 'จำนวนตัน'}},
                    series: dataYear2
                });

                Highcharts.chart('container3', {
                    chart: {type: 'column'},
                    title: {text: 'จำนวนสละที่ตัดได้รายปี 2สวน จำนวน 3ปี'},
                    xAxis: {categories: cate3},
                    yAxis: {title: {text: 'จำนวนตัน'}},
                    series: dataYear3
                });
                Highcharts.chart('container4', {
                    chart: {type: 'line'},
                    title: {text: 'ราคาสละปีที่ล่าสุด'},
                    subtitle: {text: 'ราคาต่อ 1กิโลกรัม'},
                    xAxis: {categories: cate4},
                    yAxis: {title: {text: 'วันที่'}},
                    plotOptions: {line: {dataLabels: {enabled: true}, enableMouseTracking: false}},
                    series: dataYear4
                });

                Highcharts.chart('container5', {
                    chart: {type: 'line'},
                    title: {text: 'ราคาสละปีที่แล้ว'},
                    subtitle: {text: 'ราคาต่อ 1กิโลกรัม'},
                    xAxis: {categories: cate5},
                    yAxis: {title: {text: 'วันที่'}},
                    plotOptions: {line: {dataLabels: {enabled: true}, enableMouseTracking: false}},
                    series: dataYear5
                });

                Highcharts.chart('container6', {
                    chart: {type: 'column'},
                    title: {text: 'ยอดขายย้อนหลัง และราคาเฉลี่ยต่อกิโลกรัม'},
                    subtitle: {text: 'ราคาเฉลี่ยหน่วยบาท / เงินหน่วยแสน'},
                    xAxis: {type: 'category', labels: {rotation: -45, style: {fontSize: '13px', fontFamily: 'Verdana, sans-serif'}}},
                    yAxis: {min: 0, title: {text: 'ราคาเฉลี่ยในแต่ละปี'}},
                    legend: {enabled: false},
                    tooltip: {pointFormat: 'ค่าเฉลี่ย <b>{point.y:.1f} บาท/กิโลกรัม</b>'},
                    series: [{
                            name: 'ยอดขายและราคาเฉลี่ย',
                            data: dataYear6,
                            dataLabels: {
                                enabled: true,
                                rotation: -90,
                                color: '#FFFFFF',
                                align: 'right',
                                format: '{point.y:.1f}',
                                y: 10,
                                style: {fontSize: '13px', fontFamily: 'Verdana, sans-serif'}
                            }
                        }]
                });

                Highcharts.chart('container7', {
                    chart: {type: 'bar'},
                    title: {text: 'ราคาเฉลี่ยแยกราคาช่อ กระซ้า', align: 'left'},
                    xAxis: {categories: cate7, title: {text: null}, gridLineWidth: 1, lineWidth: 0},
                    yAxis: {min: 0, title: {text: 'ราคา', align: 'high'}, labels: {overflow: 'justify'}, gridLineWidth: 0},
                    tooltip: {valueSuffix: ' บาท/จำนวนครั้งที่ขาย'},
                    plotOptions: {bar: {borderRadius: '50%', dataLabels: {enabled: true}, groupPadding: 0.1}},
                    legend: {layout: 'vertical', align: 'right', verticalAlign: 'top', x: -40, y: 80, floating: true, borderWidth: 1, backgroundColor: Highcharts.defaultOptions.legend.backgroundColor || '#FFFFFF', shadow: true},
                    credits: {enabled: false},
                    series: dataYear7
                });
            }
        </script>
    </body>
</html>
